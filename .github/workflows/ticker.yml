name: generate commit ticker

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  ticker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the ticker SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKER_USERNAME: Malik-AhmadSE
          TICKER_OUTPUT: images/commit-ticker.svg
        run: python generate_ticker.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/commit-ticker.svg
          if git commit -m "chore: refresh commit ticker"; then
            git push
          fi
