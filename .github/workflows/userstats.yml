name: generate profile stats

on:
  schedule:
    - cron: "0 3 * * *"   # regenerates daily at 3am UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate repo + contribution stats
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/repo-contrib-stats.svg
          hide-keys: general, languages
          colors: '#0A0E0F #1E2A2D 35D07F 35D07F E7ECEA'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate language distribution
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/languages.svg
          hide-keys: general, repositories, contributions
          max-languages: 8
          colors: '#0A0E0F #1E2A2D 35D07F 35D07F E7ECEA'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
